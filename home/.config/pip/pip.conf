# pip 的默认包索引 —— 指向清华 TUNA 镜像
#
# 【这个配置管谁】
# 管 venv 里那些 pip（.venv/bin/pip）。系统 python3 没有 pip —— 当初刻意
# 没装（PEP 668：apt 和 pip 会互相覆盖文件），装包一律走 uv 或 venv 里的 pip。
#
# 【和 uv 的关系：两份完全独立的配置】
# uv 不读这个文件（Astral 的设计决定），这个文件也管不着 uv。
# uv 的镜像配在 ~/.config/uv/uv.toml。改一个不影响另一个。
#
# 【为什么是 /etc 之外的用户级路径】
# ~/.config/pip/pip.conf 是 pip 的「用户级」配置，只影响你自己，
# 不需要 sudo，也不会被 apt 升级 pip 时重置。
# 优先级：命令行 > 环境变量(PIP_*) > 本文件 > /etc/pip.conf > pip 内置默认值
#
# 【不受 CC Switch 影响】
# CC Switch 只重写 ~/.claude/settings.json，碰不到这里。

[global]
index-url = https://pypi.tuna.tsinghua.edu.cn/simple

# 不需要 trusted-host：清华用的是正常 HTTPS 证书。
# 只有在用 http:// 或自签名证书的私服时才需要那一行。
#
# 【临时绕开镜像】
#     pip install --index-url https://pypi.org/simple <包名>
# 命令行参数优先级高于本文件。
