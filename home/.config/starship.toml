# ~/.config/starship.toml
#
# 效果：主行 → `user@host ~ [sudo]`，第二行照旧 `❯`
#   [sudo]    = 权限组徽标（在 sudo 组才显示）
#   root 会话 = 用户名自动变红（style_root）
#
# ⚠️ 为什么 username / hostname 要「三处全写」才像原始终端的提示符 —— starship 1.26 默认：
#   - username：show_always=false → 只有 root / 切换用户时才显示
#   - hostname：ssh_only=true → 只在 ssh 会话显示
#   - 两者默认 format 还带 " in " 后缀（会显示成 `user in host in ~`）
#   参考：starship print-config --default（导出全部默认值，1449 行）
#
# 改完即生效：starship 每次渲染提示符都重读本文件，按一下回车就能看到新样式。
# 预览命令（不依赖交互 shell）：STARSHIP_SHELL=bash starship prompt
#
# 想再加别的组徽标（如 docker）：复制 [custom.sudo] 段，改段名与 grep 目标即可。

[username]
show_always = true
style_user = "green bold"
style_root = "red bold"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "green bold"
format = "[@$hostname]($style) "

# 权限组徽标：[sudo]。when = 显示闸（exit 0 才显示）；每次渲染跑一次 id|grep ≈2ms。
[custom.sudo]
command = "echo '[sudo]'"
when = "id -Gn | grep -qw sudo"
format = "[$output]($style) "
style = "bold yellow"
