<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  让系统能正确显示中文
  创建于 2026-09-26

  背景：本机 LANG=C.UTF-8，没告诉 fontconfig「用户看中文」，
        于是它给汉字匹配 DejaVu Sans（一个纯拉丁字体，没有汉字字形），
        结果 GUI 程序（如 CC Switch）里的中文显示成乱码方块。

  思路：把 Noto CJK 作为「弱回退」追加到所有字体请求后面。
        binding="weak" 的含义 —— 只有当主字体缺字形时才用它。
        所以英文照旧用 DejaVu / Ubuntu，中文才落到 Noto CJK。
  详见 ~/env-backup/RESTORE.md 和 ~/.claude/CLAUDE.md
-->
<fontconfig>

  <!-- 无衬线场景（界面、网页正文）→ Noto Sans CJK SC -->
  <match target="pattern">
    <edit name="family" mode="append" binding="weak">
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>

  <!-- 有衬线场景 → Noto Serif CJK SC -->
  <match target="pattern">
    <edit name="family" mode="append" binding="weak">
      <string>Noto Serif CJK SC</string>
    </edit>
  </match>

  <!-- 等宽场景（终端、代码）→ Noto Sans Mono CJK SC -->
  <match target="pattern">
    <edit name="family" mode="append" binding="weak">
      <string>Noto Sans Mono CJK SC</string>
    </edit>
  </match>

  <!--
    额外保险：明确告诉 fontconfig 泛型族的首选顺序。
    有些程序直接请求 sans-serif，不走上面的规则。
  -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>DejaVu Sans</family>
      <family>Noto Sans CJK SC</family>
    </prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer>
      <family>DejaVu Serif</family>
      <family>Noto Serif CJK SC</family>
    </prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>DejaVu Sans Mono</family>
      <family>Noto Sans Mono CJK SC</family>
    </prefer>
  </alias>

</fontconfig>
