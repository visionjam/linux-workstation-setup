# ============================================================
#  tmux 配置   ~/.tmux.conf
#
#  生效方式：
#    · 新启动的 tmux 自动读取
#    · 正在跑的会话：按 前缀 + r（下面配了重载键）
#
#  按键记法：本文档里「前缀 + x」= 先按 Ctrl+a 松开，再按 x
# ============================================================

# ── 前缀键：Ctrl+b → Ctrl+a ─────────────────────────────────
# 代价：Ctrl+a 在 shell 里是「光标回行首」，必然撞车。
# 解法：连按两次 —— 第一次被 tmux 吃掉，第二次转发给 shell。
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# ── 编号从 1 开始 ───────────────────────────────────────────
# 默认从 0：键盘上 0 在 9 右边，而 1 就在左手边
set -g base-index 1
setw -g pane-base-index 1

# ── 鼠标支持 ────────────────────────────────────────────────
# 点击切面板、拖边框调大小、滚轮翻历史
# ⚠️ 副作用：鼠标拖选会被 tmux 截走 —— 想复制到 Windows 剪贴板
#    要按住 Shift 再拖（绕过 tmux 交给终端处理）
set -g mouse on

# ── vim 风格的面板切换（不用把手移去方向键）─────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── 按住不放连续调整面板大小（-r = repeatable）──────────────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── 重载配置：前缀 + r ──────────────────────────────────────
# \; 是转义的分号 —— tmux 用分号分隔多条命令，不转义会被当成两条
bind r source-file ~/.tmux.conf \; display-message "配置已重载 ✓"

# ── 缩短 Esc 等待时间 ───────────────────────────────────────
# tmux 默认等 500ms 判断"这是 Esc 还是某个序列的开头"，
# 导致 vim 里按 Esc 有明显延迟。10ms 足够区分。
set -sg escape-time 10

# ── 真彩色 ──────────────────────────────────────────────────
# 不做这两行，vim/现代 CLI 程序的配色会退化成 256 色
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# ── 回滚缓冲行数（默认 2000，翻历史很快见底）────────────────
set -g history-limit 50000

# ── 状态栏：去掉默认的亮绿底，换低调深灰 ────────────────────
set -g status-style 'bg=colour235,fg=white'
set -g window-status-current-style 'fg=colour235,bg=colour81,bold'
set -g status-left '[#S] '
set -g status-right '%m-%d %H:%M'

# ============================================================
#  你的自定义区
# ============================================================
# 格式：bind <键> <tmux 命令>
# 常用命令：
#   split-window -h / -v        左右 / 上下分割
#   select-pane -L/-R/-U/-D     切换面板
#   resize-pane -L 5            调整大小
#   kill-pane                   关掉当前面板
#   new-window                  新建窗口
#   display-message "文字"       在状态栏显示一句话
#
# 试着加一条你自己的：
